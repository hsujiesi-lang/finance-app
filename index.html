<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>My Finance</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #1a2233;
    --muted: #7a8499;
    --accent: #2f6fed;
    --accent-soft: #e8effd;
    --green: #1fa36b;
    --red: #e05252;
    --amber: #e8a23d;
    --border: #e5e9f2;
    --radius: 16px;
    --shadow: 0 1px 3px rgba(20,30,60,.06), 0 4px 14px rgba(20,30,60,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1420;
      --card: #1a2130;
      --text: #eef1f7;
      --muted: #8a93a8;
      --accent: #5b8cff;
      --accent-soft: #22304d;
      --border: #2a3348;
      --shadow: 0 1px 3px rgba(0,0,0,.3);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 90px;
  }
  .app { max-width: 520px; margin: 0 auto; padding: 20px 16px; }

  /* ---------- Header ---------- */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
  .month-nav { display: flex; align-items: center; gap: 6px; }
  .month-nav button {
    border: none; background: var(--card); color: var(--text);
    width: 32px; height: 32px; border-radius: 10px; font-size: 16px;
    cursor: pointer; box-shadow: var(--shadow);
  }
  .month-nav span { font-size: 14px; font-weight: 600; min-width: 92px; text-align: center; color: var(--muted); }

  /* ---------- Section tabs ---------- */
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab {
    flex: 1; text-align: center; padding: 10px 0; border-radius: 12px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--card); color: var(--muted); border: 1px solid var(--border);
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab.soon { opacity: .55; }
  .tab.soon small { display: block; font-size: 10px; font-weight: 500; }

  /* ---------- Budget card ---------- */
  .card {
    background: var(--card); border-radius: var(--radius);
    padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .budget-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .budget-top .label { font-size: 13px; color: var(--muted); font-weight: 600; }
  .budget-top .edit-budget { font-size: 12px; color: var(--accent); cursor: pointer; background: none; border: none; font-weight: 600; }
  .big-number { font-size: 34px; font-weight: 800; letter-spacing: -1px; margin-bottom: 2px; }
  .big-number.over { color: var(--red); }
  .sub-line { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .progress {
    height: 10px; background: var(--accent-soft); border-radius: 6px; overflow: hidden; margin-bottom: 10px;
  }
  .progress .fill { height: 100%; border-radius: 6px; background: var(--green); transition: width .4s ease; }
  .progress .fill.warn { background: var(--amber); }
  .progress .fill.over { background: var(--red); }
  .budget-stats { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .budget-stats b { color: var(--text); font-weight: 700; }

  /* ---------- Category summary ---------- */
  .section-title {
    font-size: 13px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .8px; margin: 20px 4px 10px;
  }
  .group-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 8px; }
  .group-header .g-name { font-size: 13px; font-weight: 700; color: var(--muted); }
  .group-header .g-total { font-size: 13px; font-weight: 700; }
  .cat-row {
    display: flex; align-items: center; gap: 12px; padding: 9px 4px;
  }
  .cat-row + .cat-row { border-top: 1px solid var(--border); }
  .cat-icon {
    width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center;
    justify-content: center; font-size: 17px; flex-shrink: 0; background: var(--accent-soft);
  }
  .cat-info { flex: 1; min-width: 0; }
  .cat-name { font-size: 14px; font-weight: 600; }
  .cat-bar { height: 5px; background: var(--accent-soft); border-radius: 3px; margin-top: 5px; overflow: hidden; }
  .cat-bar .fill { height: 100%; border-radius: 3px; background: var(--accent); }
  .cat-amount { font-size: 14px; font-weight: 700; white-space: nowrap; }
  .cat-amount small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; text-align: right; }

  /* ---------- Transactions ---------- */
  .tx-row { display: flex; align-items: center; gap: 12px; padding: 10px 4px; }
  .tx-row + .tx-row { border-top: 1px solid var(--border); }
  .tx-info { flex: 1; min-width: 0; }
  .tx-cat { font-size: 14px; font-weight: 600; }
  .tx-note { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx-right { text-align: right; }
  .tx-amount { font-size: 14px; font-weight: 700; }
  .tx-date { font-size: 11px; color: var(--muted); }
  .tx-del {
    border: none; background: none; color: var(--muted); font-size: 16px;
    cursor: pointer; padding: 6px; flex-shrink: 0;
  }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 26px 0; }

  /* ---------- Add button ---------- */
  .fab {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff; border: none; border-radius: 999px;
    padding: 14px 34px; font-size: 16px; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 20px rgba(47,111,237,.4); z-index: 20;
  }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,15,30,.45);
    display: none; align-items: flex-end; justify-content: center; z-index: 30;
  }
  .overlay.show { display: flex; }
  .sheet {
    background: var(--card); width: 100%; max-width: 520px;
    border-radius: 22px 22px 0 0; padding: 22px 18px calc(22px + env(safe-area-inset-bottom));
    max-height: 88vh; overflow-y: auto;
  }
  .sheet h2 { font-size: 18px; margin-bottom: 16px; }
  .field-label { font-size: 12px; font-weight: 700; color: var(--muted); margin: 14px 2px 6px; text-transform: uppercase; letter-spacing: .6px; }
  .amount-input {
    width: 100%; font-size: 30px; font-weight: 800; border: none; outline: none;
    background: var(--bg); border-radius: 12px; padding: 12px 14px; color: var(--text);
  }
  .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cat-pick {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 2px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--bg); cursor: pointer; font-size: 11px; font-weight: 600; color: var(--text);
  }
  .cat-pick .em { font-size: 20px; }
  .cat-pick.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .text-input, .date-input {
    width: 100%; font-size: 15px; border: none; outline: none;
    background: var(--bg); border-radius: 12px; padding: 12px 14px; color: var(--text);
    font-family: inherit;
  }
  .sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn { flex: 1; padding: 14px 0; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--bg); color: var(--muted); }

  /* ---------- Backup ---------- */
  .backup-hint { font-size: 12px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
  .backup-actions { display: flex; gap: 8px; }
  .btn.mini {
    padding: 10px 0; font-size: 13px; background: var(--accent-soft); color: var(--accent);
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>💰 My Finance</h1>
    <div class="month-nav">
      <button id="prevMonth">‹</button>
      <span id="monthLabel"></span>
      <button id="nextMonth">›</button>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active">Expenses</div>
    <div class="tab soon">Investing<small>coming soon</small></div>
  </div>

  <!-- Budget summary -->
  <div class="card">
    <div class="budget-top">
      <span class="label">LEFT TO SPEND THIS MONTH</span>
      <button class="edit-budget" id="editBudget">Edit budget</button>
    </div>
    <div class="big-number" id="remaining">$0</div>
    <div class="sub-line" id="budgetLine"></div>
    <div class="progress"><div class="fill" id="progressFill" style="width:0%"></div></div>
    <div class="budget-stats">
      <span>Spent <b id="spentTotal">$0</b></span>
      <span id="dailyHint"></span>
    </div>
  </div>

  <!-- Category breakdown -->
  <div class="section-title">Spending by Category</div>
  <div id="catSummary"></div>

  <!-- Transaction list -->
  <div class="section-title">Transactions</div>
  <div class="card" id="txList"></div>

  <!-- Backup -->
  <div class="section-title">Backup</div>
  <div class="card backup-card">
    <p class="backup-hint">Your data lives only on this device. Export a backup regularly so you never lose your records.</p>
    <div class="backup-actions">
      <button class="btn mini" id="exportCsv">Export CSV</button>
      <button class="btn mini" id="exportJson">Backup JSON</button>
      <button class="btn mini" id="importJson">Restore</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </div>
</div>

<button class="fab" id="addBtn">＋ Add Expense</button>

<!-- Add expense sheet -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <h2>Add Expense</h2>
    <div class="field-label">Amount ($)</div>
    <input class="amount-input" id="inAmount" type="number" inputmode="decimal" placeholder="0" step="0.01" min="0">
    <div class="field-label">Category</div>
    <div class="cat-grid" id="catGrid"></div>
    <div class="field-label">Date</div>
    <input class="date-input" id="inDate" type="date">
    <div class="field-label">Note (optional)</div>
    <input class="text-input" id="inNote" type="text" placeholder="e.g. Coles, bubble tea…">
    <div class="sheet-actions">
      <button class="btn ghost" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script>
// ---------- Categories, grouped ----------
const GROUPS = [
  { name: "Fixed Bills", cats: [
    { id: "water",     name: "Water",          em: "🚿" },
    { id: "electric",  name: "Electricity",    em: "⚡" },
    { id: "mgmt",      name: "Management Fee", em: "🏢" },
    { id: "internet",  name: "Internet",       em: "📶" },
  ]},
  { name: "Food & Drinks", cats: [
    { id: "groceries", name: "Groceries",      em: "🛒" },
    { id: "lunch",     name: "Lunch",          em: "🍱" },
    { id: "dinner",    name: "Dinner",         em: "🍜" },
    { id: "drinks",    name: "Drinks",         em: "🧋" },
  ]},
  { name: "Lifestyle", cats: [
    { id: "shopping",  name: "Shopping",       em: "🛍️" },
    { id: "fun",       name: "Entertainment",  em: "🎬" },
  ]},
  { name: "Transport", cats: [
    { id: "transport", name: "Transport",      em: "🚇" },
  ]},
];
const CATS = GROUPS.flatMap(g => g.cats);
const catById = id => CATS.find(c => c.id === id) || { name: id, em: "💸" };

// ---------- State ----------
const store = {
  load() { try { return JSON.parse(localStorage.getItem("finance-data")) || { budget: 2000, txs: [] }; } catch { return { budget: 2000, txs: [] }; } },
  save(d) { localStorage.setItem("finance-data", JSON.stringify(d)); }
};
let data = store.load();
let view = new Date();          // month being viewed
let selectedCat = null;

const $ = id => document.getElementById(id);
const fmt = n => { const v = Math.round(n * 100) / 100; return "$" + v.toLocaleString("en-US", { minimumFractionDigits: Number.isInteger(v) ? 0 : 2, maximumFractionDigits: 2 }); };
const monthKey = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");

// ---------- Render ----------
function render() {
  const key = monthKey(view);
  const now = new Date();
  const isCurrent = key === monthKey(now);
  $("monthLabel").textContent = view.toLocaleString("en-US", { month: "short", year: "numeric" });

  const txs = data.txs.filter(t => t.date.startsWith(key)).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  const spent = txs.reduce((s, t) => s + t.amount, 0);
  const remaining = data.budget - spent;

  // Budget card
  const rEl = $("remaining");
  rEl.textContent = fmt(remaining);
  rEl.classList.toggle("over", remaining < 0);
  $("budgetLine").textContent = "Monthly budget " + fmt(data.budget);
  $("spentTotal").textContent = fmt(spent);
  const pct = data.budget > 0 ? Math.min(spent / data.budget * 100, 100) : 0;
  const fill = $("progressFill");
  fill.style.width = pct + "%";
  fill.className = "fill" + (spent > data.budget ? " over" : pct > 80 ? " warn" : "");

  if (isCurrent && remaining > 0) {
    const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const daysLeft = daysInMonth - now.getDate() + 1;
    $("dailyHint").innerHTML = "≈ <b>" + fmt(remaining / daysLeft) + "</b>/day for " + daysLeft + " days";
  } else {
    $("dailyHint").textContent = "";
  }

  // Category breakdown, grouped
  const byCat = {};
  txs.forEach(t => byCat[t.cat] = (byCat[t.cat] || 0) + t.amount);
  const maxCat = Math.max(1, ...Object.values(byCat));
  let html = "";
  GROUPS.forEach(g => {
    const gTotal = g.cats.reduce((s, c) => s + (byCat[c.id] || 0), 0);
    if (gTotal === 0) return;
    html += '<div class="card" style="padding:14px 14px 8px">';
    html += '<div class="group-header"><span class="g-name">' + g.name + '</span><span class="g-total">' + fmt(gTotal) + '</span></div>';
    g.cats.forEach(c => {
      const amt = byCat[c.id] || 0;
      if (amt === 0) return;
      const share = spent > 0 ? Math.round(amt / spent * 100) : 0;
      html += '<div class="cat-row">' +
        '<div class="cat-icon">' + c.em + '</div>' +
        '<div class="cat-info"><div class="cat-name">' + c.name + '</div>' +
        '<div class="cat-bar"><div class="fill" style="width:' + (amt / maxCat * 100) + '%"></div></div></div>' +
        '<div class="cat-amount">' + fmt(amt) + '<small>' + share + '%</small></div></div>';
    });
    html += '</div>';
  });
  $("catSummary").innerHTML = html || '<div class="card"><div class="empty">No spending yet this month 🎉</div></div>';

  // Transactions
  if (txs.length === 0) {
    $("txList").innerHTML = '<div class="empty">No transactions yet.<br>Tap “＋ Add Expense” to start.</div>';
  } else {
    $("txList").innerHTML = txs.map(t => {
      const c = catById(t.cat);
      const d = new Date(t.date + "T00:00");
      return '<div class="tx-row">' +
        '<div class="cat-icon">' + c.em + '</div>' +
        '<div class="tx-info"><div class="tx-cat">' + c.name + '</div>' +
        (t.note ? '<div class="tx-note">' + escapeHtml(t.note) + '</div>' : '') + '</div>' +
        '<div class="tx-right"><div class="tx-amount">−' + fmt(t.amount) + '</div>' +
        '<div class="tx-date">' + d.toLocaleString("en-US", { month: "short", day: "numeric" }) + '</div></div>' +
        '<button class="tx-del" data-id="' + t.id + '">✕</button></div>';
    }).join("");
  }
}
function escapeHtml(s) { return s.replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])); }

// ---------- Add-expense sheet ----------
function openSheet() {
  selectedCat = null;
  $("inAmount").value = "";
  $("inNote").value = "";
  const today = new Date();
  $("inDate").value = today.toISOString().slice(0, 10);
  $("catGrid").innerHTML = CATS.map(c =>
    '<div class="cat-pick" data-id="' + c.id + '"><span class="em">' + c.em + '</span>' + c.name + '</div>'
  ).join("");
  $("overlay").classList.add("show");
  setTimeout(() => $("inAmount").focus(), 100);
}
function closeSheet() { $("overlay").classList.remove("show"); }

$("addBtn").onclick = openSheet;
$("cancelBtn").onclick = closeSheet;
$("overlay").onclick = e => { if (e.target === $("overlay")) closeSheet(); };

$("catGrid").onclick = e => {
  const el = e.target.closest(".cat-pick");
  if (!el) return;
  selectedCat = el.dataset.id;
  document.querySelectorAll(".cat-pick").forEach(p => p.classList.toggle("sel", p === el));
};

$("saveBtn").onclick = () => {
  const amount = parseFloat($("inAmount").value);
  if (!amount || amount <= 0) { $("inAmount").focus(); return; }
  if (!selectedCat) { alert("Please pick a category"); return; }
  data.txs.push({
    id: Date.now(),
    amount: Math.round(amount * 100) / 100,
    cat: selectedCat,
    date: $("inDate").value || new Date().toISOString().slice(0, 10),
    note: $("inNote").value.trim()
  });
  store.save(data);
  closeSheet();
  render();
};

// ---------- Delete ----------
$("txList").onclick = e => {
  const btn = e.target.closest(".tx-del");
  if (!btn) return;
  if (!confirm("Delete this expense?")) return;
  data.txs = data.txs.filter(t => t.id !== Number(btn.dataset.id));
  store.save(data);
  render();
};

// ---------- Backup: export / restore ----------
function download(filename, text, type) {
  const blob = new Blob([text], { type });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
const stamp = () => new Date().toISOString().slice(0, 10);

$("exportCsv").onclick = () => {
  const rows = [["Date", "Category", "Group", "Amount", "Note"]];
  const groupOf = id => (GROUPS.find(g => g.cats.some(c => c.id === id)) || {}).name || "";
  [...data.txs].sort((a, b) => a.date.localeCompare(b.date)).forEach(t => {
    rows.push([t.date, catById(t.cat).name, groupOf(t.cat), t.amount, t.note || ""]);
  });
  const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(",")).join("\n");
  download("finance-" + stamp() + ".csv", "\uFEFF" + csv, "text/csv;charset=utf-8");
};

$("exportJson").onclick = () => {
  download("finance-backup-" + stamp() + ".json", JSON.stringify(data, null, 2), "application/json");
};

$("importJson").onclick = () => $("importFile").click();
$("importFile").onchange = e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (typeof d.budget !== "number" || !Array.isArray(d.txs)) throw new Error("bad format");
      if (!confirm("Restore from backup? This replaces the " + data.txs.length + " record(s) currently on this device.")) return;
      data = { budget: d.budget, txs: d.txs.filter(t => t && typeof t.amount === "number" && t.date && t.cat) };
      store.save(data);
      render();
      alert("Restored " + data.txs.length + " record(s) ✓");
    } catch {
      alert("This file is not a valid backup.");
    }
  };
  reader.readAsText(file);
};

// ---------- Month nav & budget ----------
$("prevMonth").onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
$("nextMonth").onclick = () => { view.setMonth(view.getMonth() + 1); render(); };
$("editBudget").onclick = () => {
  const v = prompt("Monthly budget ($):", data.budget);
  if (v === null) return;
  const n = parseFloat(v);
  if (n > 0) { data.budget = n; store.save(data); render(); }
};

render();
</script>
</body>
</html>
